[tools]
node = "22"
pnpm = "10.33.3"

[env]
_.path = ["node_modules/.bin"]

[tasks.dev]
description = "Start the Next.js dev server"
run = "pnpm dev"

[tasks.verify]
description = "Run solar geometry checks"
run = "pnpm verify"

[tasks.build]
description = "Create a production build"
run = "pnpm build"
